<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Meowp</title>
    <style>
      body { margin: 0; overflow: hidden; }
    </style>
  </head>
  <body>

    <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>

    <script>
      
      const scene = new THREE.Scene();

        scene.fog = new THREE.FogExp2( 0x000000, 0.035);
      
      const camera = new THREE.PerspectiveCamera( 75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 5;

      
      const renderer = new THREE.WebGLRenderer({});
      renderer.setSize(window.innerWidth, window.innerHeight);
      document.body.appendChild(renderer.domElement);



const starCount = 20000;
const positions = new Float32Array(starCount * 3);

for (let i = 0; i < starCount; i++) {
  const z = -Math.random() * 200;          
  const spread = Math.abs(z) * 0.15;       // tunnel-y tunnel-y thing ... random angle e bhitore dike dour debe ... i didn't really think this through so it looks really really weird
  const angle = Math.random() * Math.PI * 2;
  const r = Math.random() * spread;

  positions[i * 3]     = Math.cos(angle) * r;
  positions[i * 3 + 1] = Math.sin(angle) * r;
  positions[i * 3 + 2] = z;
}

const starGeometry = new THREE.BufferGeometry();
starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

const texture = new THREE.TextureLoader().load('./star_option_3.png');//uhhhh eita live server chhara kaaj korchhe na else it's just appearing as a quad ?!

const exa_pal = [
  new THREE.Color('#C39A22'),
  new THREE.Color('#FFD700'),
  new THREE.Color('#FDDC5C'),
  new THREE.Color('#FFFFFF'),
  new THREE.Color('#FFFFF0'),
  new THREE.Color('#F5F5DC'),
  new THREE.Color('#000000'),
  new THREE.Color('#160D08'),
  new THREE.Color('#27292B')
];

const colors = new Float32Array(starCount * 3);

for (let i = 0; i < starCount; i++) {
  const c = exa_pal[Math.floor(Math.random() * exa_pal.length)];

  colors[i * 3]     = c.r;
  colors[i * 3 + 1] = c.g;
  colors[i * 3 + 2] = c.b;
}

starGeometry.setAttribute(
  'color',
  new THREE.BufferAttribute(colors, 3)
);

const starMaterial = new THREE.PointsMaterial({
  map: texture,
  transparent: true,
  alphaTest: 0.01, 
  depthWrite: false,   
  size: 0.07,
  vertexColors: true,
  fog: true
});

const stars = new THREE.Points(starGeometry, starMaterial);
scene.add(stars);


      
      function animate() { 
        
        requestAnimationFrame(animate);


  	const positions = stars.geometry.attributes.position.array;

    let wSpeed = 0.38;
    
    const speed = 0.25;          // slow kore dilam, hmm ? 
    const spawnZ = -200;         
    const coneAngle = 0.35;      


  	for (let i = 0; i < positions.length; i += 3) {

      //positions[i + 2] += speed;//if u wanna use the depth norm., get rid of this ... my aesthetic sense is non-existence

      
      const z = positions[i + 2];

      const depthFactor = THREE.MathUtils.clamp( Math.abs(z) / 200, 0.1, 1);

      positions[i + 2] += speed * depthFactor;

    
      if (positions[i + 2] > camera.position.z) {

        const z = spawnZ;
        const radius = Math.abs(z) * coneAngle;

        const theta = Math.random() * Math.PI * 2;
        const r = Math.random() * radius;

        positions[i]     = Math.cos(theta) * r;
        positions[i + 1] = Math.sin(theta) * r;
        positions[i + 2] = z;
      }
    
  }
  	


  	stars.geometry.attributes.position.needsUpdate = true;




  renderer.render(scene, camera);

}
      

animate();

    </script>
  </body>
</html>
